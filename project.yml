name: VocalCue
options:
  bundleIdPrefix: com.vocalcue
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  VocalCue:
    type: application
    platform: macOS
    sources:
      - path: VocalCue
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocalcue.app
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: VocalCue/Info.plist
        CODE_SIGN_ENTITLEMENTS: VocalCue/VocalCue.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: "VocalCue"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: VocalCue/VocalCue.entitlements
